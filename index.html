<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран установки (показывается в браузере) -->
    <div class="install-screen" id="installScreen">
        <div class="install-container">
            <h1>Заметки</h1>
            <p>Установите приложение для оффлайн доступа к вашим заметкам</p>
            <button class="install-btn" id="installBtn">
                Установить приложение
            </button>
            <div class="install-info">
                <p>Работает оффлайн</p>
                <p>Данные хранятся локально</p>
                <p>Быстрый доступ</p>
                <p>Системные конспекты включены</p>
                <p>Работает в самолете</p>
            </div>
        </div>
    </div>

    <!-- Основное приложение (показывается в PWA) -->
    <div class="app" id="app" style="display: none;">
        <!-- Боковое меню -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Заметки</h2>
                <button class="add-theme-btn" id="addThemeBtn">Новая заметка</button>
            </div>
            <nav class="theme-list" id="themeList">
                <!-- Темы будут добавляться сюда -->
            </nav>
        </aside>

        <!-- Основная область -->
        <main class="main-content">
            <header class="main-header">
                <button class="settings-btn" id="settingsBtn">☰</button>
                <h1 id="currentThemeTitle">Выберите тему</h1>
                <button class="save-btn" id="saveNoteBtn">Сохранить</button>
            </header>
            
            <div class="offline-indicator" id="offlineIndicator" style="display: none;">
                Оффлайн режим - все данные сохранены локально
            </div>
            
            <div class="editor-area">
                <textarea 
                    id="noteEditor" 
                    placeholder="Введите вашу заметку здесь..."
                    disabled
                ></textarea>
            </div>
        </main>
    </div>

    <!-- Модальное окно для добавления темы -->
    <div class="modal" id="addThemeModal">
        <div class="modal-content">
            <h3>Новая заметка</h3>
            <input type="text" id="newThemeName" placeholder="Название заметки">
            <div class="modal-buttons">
                <button id="cancelAddTheme">Отмена</button>
                <button id="confirmAddTheme">Создать</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно настроек -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Настройки</h3>
            <div class="settings-option">
                <label for="themeToggle">Темная тема</label>
                <input type="checkbox" id="themeToggle">
            </div>
            <div class="modal-buttons">
                <button id="closeSettings">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="system-notes.js"></script>
    <script src="app.js"></script>
</body>
</html>
