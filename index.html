<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран установки -->
    <div class="install-screen" id="installScreen">
        <div class="install-container">
            <h1>Заметки</h1>
            <p>Установите приложение для оффлайн доступа к вашим заметкам</p>
            <button class="install-btn" id="installBtn">Установить приложение</button>
            <div class="install-info">
                <p>Работает оффлайн</p>
                <p>Данные хранятся локально</p>
                <p>Быстрый доступ</p>
                <p>Системные конспекты включены</p>
                <p>Работает в самолете</p>
            </div>
        </div>
    </div>

    <!-- Основное приложение -->
    <div class="app" id="app" style="display: none;">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-top">
                    <h2>Заметки</h2>
                    <button class="collapse-btn" id="collapseBtn" title="Свернуть меню">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 960'%3E%3Cpath fill='%23e0e0e0' d='M480 345 240 585l43 43 197-198 197 198 43-43z'/%3E%3C/svg%3E" alt="Свернуть" class="arrow-icon collapse-arrow" id="collapseIcon">
                    </button>
                </div>
                <button class="add-theme-btn" id="addThemeBtn">Новая заметка</button>
            </div>
            <nav class="theme-list" id="themeList"></nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <button class="expand-btn" id="expandBtn" title="Развернуть меню" style="display: none;">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 960'%3E%3Cpath fill='%23e0e0e0' d='M480 345 240 585l43 43 197-198 197 198 43-43z'/%3E%3C/svg%3E" alt="Развернуть" class="arrow-icon expand-arrow">
                </button>
                <h1 id="currentThemeTitle">Выберите тему</h1>
                <div class="connection-indicator" id="connectionIndicator"></div>
                <button class="save-btn" id="saveNoteBtn">Сохранить</button>
                <button class="settings-icon-btn" id="settingsBtn" title="Настройки">
                    <span class="menu-icon-line"></span>
                    <span class="menu-icon-line"></span>
                    <span class="menu-icon-line"></span>
                </button>
            </header>
            
            <div class="offline-indicator" id="offlineIndicator" style="display: none;">
                <span>Оффлайн режим</span>
                <button class="close-offline" id="closeOfflineBtn">×</button>
            </div>
            
            <div class="editor-area">
                <textarea id="noteEditor" placeholder="Введите вашу заметку здесь..." disabled></textarea>
                
                <!-- Редактор кода -->
                <div class="code-editor" id="codeEditor" style="display: none;">
                    <div class="code-editor-top" id="codeEditorTop">
                        <div class="code-editor-wrapper">
                            <div class="line-numbers" id="lineNumbers">1</div>
                            <textarea class="code-textarea" id="codeTextarea" placeholder="Введите ваш код здесь..." wrap="off" spellcheck="false"></textarea>
                        </div>
                    </div>
                    
                    <div class="resizer-horizontal" id="resizerHorizontal"></div>
                    
                    <div class="code-editor-bottom" id="codeEditorBottom">
                        <div class="code-actions">
                            <button class="run-btn" id="runCodeBtn">Запустить</button>
                            <button class="open-window-btn" id="openWindowBtn" title="Открыть в новом окне">
                                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='20' y='20' width='50' height='50' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M20 80 L80 20 M80 20 L50 20 M80 20 L80 50' stroke='white' stroke-width='5' fill='none'/%3E%3C/svg%3E" alt="Открыть">
                            </button>
                        </div>
                        
                        <div class="console-container" id="consoleContainer">
                            <div class="console-header">
                                <span>Консоль</span>
                                <button class="console-toggle-btn" id="consoleToggleBtn">
                                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 960'%3E%3Cpath fill='%23e0e0e0' d='M480 345 240 585l43 43 197-198 197 198 43-43z'/%3E%3C/svg%3E" alt="toggle" class="console-arrow down" id="consoleArrow">
                                </button>
                            </div>
                            <div class="console-output" id="consoleOutput"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Полноэкранный вывод -->
                <div class="fullscreen-overlay" id="fullscreenOverlay" style="display: none;">
                    <div class="fullscreen-output">
                        <div class="fullscreen-header">
                            <h3>Результат</h3>
                            <button class="close-fullscreen-btn" id="closeFullscreenBtn">×</button>
                        </div>
                        <iframe id="codeIframeFull" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                    </div>
                </div>
                
                <!-- Настройки -->
                <div class="settings-panel" id="settingsPanel" style="display: none;">
                    <div class="settings-header"><h3>Настройки</h3></div>
                    <div class="settings-content">
                        <div class="settings-option">
                            <label for="themeToggle">Темная тема</label>
                            <input type="checkbox" id="themeToggle">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Модальные окна -->
    <div class="modal" id="addThemeModal">
        <div class="modal-content">
            <h3>Новая заметка</h3>
            <input type="text" id="newThemeName" placeholder="Название заметки">
            <div class="modal-buttons">
                <button id="cancelAddTheme">Отмена</button>
                <button id="confirmAddTheme">Создать</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addFileModal">
        <div class="modal-content">
            <h3>Новый файл</h3>
            <input type="text" id="newFileName" placeholder="Название файла (например: index.html)">
            <div class="modal-buttons">
                <button id="cancelAddFile">Отмена</button>
                <button id="confirmAddFile">Создать</button>
            </div>
        </div>
    </div>

    <script src="system-notes.js"></script>
    <script src="app.js"></script>
</body>
</html>
